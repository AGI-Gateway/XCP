id: slack
name: Slack
vendor: Slack Technologies
description: Slack via its Model Context Protocol endpoint.

endpoint:
  url: https://mcp.slack.com/mcp
  transport: streamable_http
  mcp_spec: "2026-07-28"

verification:
  status: unconfirmed
  source: https://www.usecarly.com/blog/chatgpt-mcp-servers/
  checked: "2026-09-08"

auth:
  method: oauth2_auth_code
  scopes: [channels:read, chat:write, search:read]
  secrets:
    client_id: vault://env/connectors/slack#client_id
    client_secret: vault://env/connectors/slack#client_secret

trust:
  class: unknown
  min_tier: A0xH1
  min_write_tier: A1xH1

scopes_exposed:
  - mcp:tools/slack.search
  - mcp:tools/slack.post_message

tags: [communication]
maintainer: anonymous
notes: >
  Verify inbound webhooks with the signing secret (HMAC over timestamp +
  body) and reject anything older than five minutes.
