id: aws
name: Amazon Web Services
vendor: Amazon.com, Inc.
description: Amazon Web Services via its Model Context Protocol endpoint.

endpoint:
  url: https://mcp.aws.amazon.com/mcp
  transport: streamable_http
  mcp_spec: "2026-07-28"

verification:
  status: unconfirmed
  source: https://mcpplaygroundonline.com/blog/awesome-mcp-servers
  checked: "2026-09-08"

auth:
  method: oauth2_client_creds
  scopes: []
  secrets:
    client_id: vault://env/connectors/aws#client_id
    client_secret: vault://env/connectors/aws#client_secret

trust:
  class: unknown
  min_tier: A1xH2
  min_write_tier: A2xH2

scopes_exposed:
  - mcp:tools/aws.describe_resources
  - mcp:tools/aws.invoke_operation

tags: [cloud, infrastructure]
maintainer: anonymous
notes: >
  The managed server went GA on 6 May 2026 fronting 15,000+ AWS API
  operations. That is an enormous blast radius: scope the IAM role hard and
  require A2xH2 for anything mutating.
