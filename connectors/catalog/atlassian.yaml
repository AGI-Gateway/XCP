# Generated by scripts/seed-catalog.py — edit there, or add your own file.
# Nothing here is secret. Credentials are vault:// REFERENCES resolved at runtime.
id: atlassian
name: Atlassian (Jira, Confluence, JSM, Bitbucket)
vendor: Atlassian
description: Atlassian (Jira, Confluence, JSM, Bitbucket) via its Model Context Protocol endpoint.

endpoint:
  url: https://mcp.atlassian.com/v2/mcp
  transport: streamable_http
  mcp_spec: "2026-07-28"

verification:
  status: confirmed
  source: https://github.com/atlassian/atlassian-mcp-server
  checked: "2026-09-08"

auth:
  method: oauth2_auth_code
  scopes: []
  secrets:
    client_id: vault://env/connectors/atlassian#client_id
    client_secret: vault://env/connectors/atlassian#client_secret

trust:
  class: probed
  min_tier: A0xH1
  min_write_tier: A1xH2

scopes_exposed:
  - mcp:tools/jira.search_issues
  - mcp:tools/jira.create_issue
  - mcp:tools/confluence.search
  - mcp:tools/confluence.create_page

tags: [devtools, itsm, knowledge]
maintainer: anonymous
notes: >
  OAuth 2.1 or API token. The legacy SSE endpoint (/v1/sse) stopped working
  on 30 June 2026 — Streamable HTTP only. API-token auth needs an org admin
  to enable it, and is required for Jira Service Management tools. Access is
  limited to what the user can already see.
