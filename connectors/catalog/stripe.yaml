id: stripe
name: Stripe
vendor: Stripe, Inc.
description: Stripe via its Model Context Protocol endpoint.

endpoint:
  url: https://mcp.stripe.com
  transport: streamable_http
  mcp_spec: "2026-07-28"

verification:
  status: confirmed
  source: https://openhelm.ai/blog/best-remote-mcp-servers-2026
  checked: "2026-09-08"

auth:
  method: api_key
  scopes: []
  secrets:
    api_key: vault://hashicorp/connectors/stripe#api_key

trust:
  class: probed
  min_tier: A2xH2
  min_write_tier: A2xH2

scopes_exposed:
