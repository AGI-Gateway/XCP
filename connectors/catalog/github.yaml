# Generated by scripts/seed-catalog.py — edit there, or add your own file.
# Nothing here is secret. Credentials are vault:// REFERENCES resolved at runtime.
id: github
name: GitHub
vendor: GitHub, Inc.
description: GitHub via its Model Context Protocol endpoint.

endpoint:
  url: https://api.githubcopilot.com/mcp/
  transport: streamable_http
  mcp_spec: "2026-07-28"

verification:
  status: confirmed
  source: https://openhelm.ai/blog/best-remote-mcp-servers-2026
  checked: "2026-09-08"

auth:
  method: oauth2_auth_code
  scopes: [repo, read:org, workflow]
  secrets:
    client_id: vault://env/connectors/github#client_id
    client_secret: vault://env/connectors/github#client_secret

trust:
  class: probed
  min_tier: A0xH0
  min_write_tier: A1xH1

scopes_exposed:
  - mcp:tools/github.search
  - mcp:tools/github.read_file
  - mcp:tools/github.create_issue
  - mcp:tools/github.create_pull_request

tags: [devtools, scm]
maintainer: anonymous
notes: >
  Prefer a GitHub App with short-lived installation tokens over a classic
  PAT with broad scopes. OAuth tokens do not expire by default.
