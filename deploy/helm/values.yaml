# XCP Helm values. Defaults are safe-by-default: enforce posture, no
# privileged containers, read-only root filesystem.

image:
  repository: ghcr.io/agi-gateway/xcp
  tag: "0.1.0"
  # Pin by digest in production. A tag is mutable; a digest is not, and this
  # chart deploys the component that enforces everyone else's supply chain.
  digest: ""          # e.g. sha256:abc123...
  pullPolicy: IfNotPresent

gateway:
  replicas: 2
  posture: enforce          # enforce | observe — observe is for onboarding only
  security: "1"             # XCP_SECURITY=1 enables the argument firewall
  upstreams: {}             # name -> MCP url
  # Abuse controls. false on a node reachable by strangers makes it an open
  # relay. Rendered into the pod unconditionally so `kubectl describe` states
  # the posture rather than relying on the image default.
  rateLimit: true
  # Serve traffic if the limiter itself fails. Turns any limiter outage into an
  # unmetered window.
  limitFailOpen: false
  # Serve the FULL node record to anyone, even inside a closed cluster.
  nodeRecordPublic: false
  # This node's site, e.g. eu-west. Locality is a COST: an off-site peer is
  # priced at CROSS_SITE_COST and can still win.
  nodeSite: ""
  # Sites data may reach. Unlike locality this is a CONSTRAINT: a site outside
  # this list is inadmissible at any price.
  residencySites: []
  service: {type: ClusterIP, port: 8080}
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits:   {cpu: "1",  memory: 512Mi}

verifier:
  enabled: true
  replicas: 2
  chainRpc: ""              # set with sessionRegistry for on-chain mode
  sessionRegistry: ""
  service: {port: 8500}

server:
  enabled: false            # your own MCP servers usually live elsewhere
  replicas: 1
  name: research            # XCP_SERVER_NAME; must match a key in gateway.upstreams
  # Refuse calls that did not arrive through a gateway. false lets an agent
  # reach the server directly, bypassing every mandate check the gateway
  # performs — which is the whole reason the gateway is in front of it.
  requireVerified: true
  service: {port: 9001}
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 256Mi}

trust:
  agent: registry           # free | registry | company
  human: enterprise         # public | general_sso | enterprise

mtls:
  enabled: true
  secretName: xcp-tls   # must contain ca.crt, tls.crt, tls.key

# Several datacentres inside one organisation. Without this, a peer on a
# private address is unreachable and a peer signed by an internal CA cannot be
# verified — so a production-profile node cannot federate internally at all.
# See docs/runbook.md, "Private federation".
privateFederation:
  enabled: false
  # Internal ranges that may hold peers. Declare the ranges that actually hold
  # gateways, not the whole of 10.0.0.0/8: this is the scope of what peering
  # can reach. Anything outside is still refused, and loopback, link-local,
  # cloud-metadata and CGNAT addresses stay refused even inside a declaration.
  # Declarations broader than /8 (IPv4) or /7 (IPv6) are refused outright.
  peerCidrs: []
  #  - 10.40.0.0/16
  #  - fd00:dc1::/48

  # Secret holding the PEM authorities that sign this federation's peers. It
  # REPLACES the public trust store for peer verification — and only for that,
  # so upstream tool calls keep public trust. A mixed federation puts the
  # public roots it needs in the same file. An unreadable or empty bundle stops
  # the pod, rather than silently verifying peers against the public store.
  peerCaSecretName: ""        # e.g. xcp-internal-roots
  peerCaKey: ca.pem           # key within that secret

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  seccompProfile: {type: RuntimeDefault}
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities: {drop: [ALL]}

telemetry:
  enabled: false                # XCP_OTEL
  endpoint: ""                  # OTEL_EXPORTER_OTLP_ENDPOINT
  serviceName: xcp-gateway
  # scrubbed | hosts | full. `full` exports raw identifiers and is only
  # appropriate for a self-hosted collector — see docs/runbook.md.
  detail: scrubbed

serviceMonitor:
  enabled: false            # set true if you run the Prometheus operator

# The self-hosted decision engine: a local classifier that estimates a
# request's complexity and risk so cheap requests can take a cheap route.
#
# Advisory ONLY. It cannot change whether a request is permitted, in either
# direction, and a refusal never cites it. Off by default.
engine:
  enabled: false
  # Per-request classification budget. A tier whose typical cost exceeds what
  # remains is skipped, because a classifier that adds latency has failed at
  # its own job. The default excludes the ~25ms semantic tier, which must
  # therefore be opted into by raising this deliberately.
  budgetMicros: 2000
  # Paths to models inside the image or a mounted volume. Absent, those tiers
  # abstain and the node routes as it would with no engine at all.
  fastTextPath: ""
  setFitPath: ""
