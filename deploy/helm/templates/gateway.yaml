apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-gateway
  labels: {app: {{ .Release.Name }}-gateway}
spec:
  replicas: {{ .Values.gateway.replicas }}
  selector: {matchLabels: {app: {{ .Release.Name }}-gateway}}
  template:
    metadata:
      labels: {app: {{ .Release.Name }}-gateway}
    spec:
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: gateway
          image: "{{ .Values.image.repository }}{{ if .Values.image.digest }}@{{ .Values.image.digest }}{{ else }}:{{ .Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports: [{containerPort: 8080, name: http}]
          env:
            - {name: ROLE,          value: "gateway"}
            - {name: XCP_POSTURE,   value: {{ .Values.gateway.posture | quote }}}
            {{- if .Values.telemetry.enabled }}
            - {name: XCP_OTEL, value: "1"}
            - {name: XCP_OTEL_DETAIL, value: {{ .Values.telemetry.detail | quote }}}
            - {name: OTEL_SERVICE_NAME, value: {{ .Values.telemetry.serviceName | quote }}}
            - {name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.telemetry.endpoint | quote }}}
            {{- end }}
            - {name: XCP_SECURITY,  value: {{ .Values.gateway.security | quote }}}
            - {name: XCP_UPSTREAMS, value: {{ .Values.gateway.upstreams | toJson | quote }}}
            # Abuse controls and the settings that weaken them. Rendered
            # unconditionally rather than behind an `if`, so the pod's
            # environment states the posture explicitly instead of relying on
            # the image default -- an operator reading `kubectl describe` can
            # see what is on.
            - {name: XCP_RATE_LIMIT, value: {{ ternary "1" "0" .Values.gateway.rateLimit | quote }}}
            - {name: XCP_LIMIT_FAIL_OPEN, value: {{ ternary "1" "0" .Values.gateway.limitFailOpen | quote }}}
            - {name: XCP_NODE_RECORD_PUBLIC, value: {{ ternary "1" "0" .Values.gateway.nodeRecordPublic | quote }}}
            {{- if .Values.gateway.nodeSite }}
            # Locality is a cost: an off-site peer is priced at CROSS_SITE_COST
            # and can still win.
            - {name: XCP_NODE_SITE, value: {{ .Values.gateway.nodeSite | quote }}}
            {{- end }}
            {{- if .Values.gateway.residencySites }}
            # Residency is a constraint: a site outside this set is
            # inadmissible at any price.
            - {name: XCP_RESIDENCY_SITES, value: {{ join "," .Values.gateway.residencySites | quote }}}
            {{- end }}
            {{- if .Values.engine.enabled }}
            # Advisory only. The engine cannot change whether a request is
            # permitted, in either direction, and unlike XCP_SECURITY the
            # gateway does not refuse to start when it is unavailable: an
            # absent optimisation is not an absent control.
            - {name: XCP_ENGINE, value: "1"}
            - {name: XCP_ENGINE_BUDGET_MICROS, value: {{ .Values.engine.budgetMicros | quote }}}
            {{- if .Values.engine.fastTextPath }}
            - {name: XCP_ENGINE_FASTTEXT, value: {{ .Values.engine.fastTextPath | quote }}}
            {{- end }}
            {{- if .Values.engine.setFitPath }}
            - {name: XCP_ENGINE_SETFIT, value: {{ .Values.engine.setFitPath | quote }}}
            {{- end }}
            {{- end }}
            {{- if .Values.verifier.enabled }}
            - {name: XCP_VERIFY_URL, value: "http://{{ .Release.Name }}-verifier:{{ .Values.verifier.service.port }}"}
            {{- end }}
            {{- if .Values.privateFederation.enabled }}
            {{- if .Values.privateFederation.peerCidrs }}
            - {name: XCP_PRIVATE_PEER_CIDRS, value: {{ join "," .Values.privateFederation.peerCidrs | quote }}}
            {{- end }}
            {{- if .Values.privateFederation.peerCaSecretName }}
            - {name: XCP_PEER_CA_BUNDLE, value: "/etc/xcp/peer-ca/{{ .Values.privateFederation.peerCaKey }}"}
            {{- end }}
            {{- end }}
          readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3}
          livenessProbe:  {httpGet: {path: /health, port: http}, initialDelaySeconds: 10}
          resources: {{- toYaml .Values.gateway.resources | nindent 12 }}
          volumeMounts:
            {{- if .Values.mtls.enabled }}
            - {name: tls, mountPath: /etc/xcp/tls, readOnly: true}
            {{- end }}
            {{- if and .Values.privateFederation.enabled .Values.privateFederation.peerCaSecretName }}
            # The federation trust anchor, mounted separately from the mTLS
            # material even when both come from the same CA: one says who may
            # connect to this gateway, the other who may be a peer.
            - {name: peer-ca, mountPath: /etc/xcp/peer-ca, readOnly: true}
            {{- end }}
      volumes:
        {{- if .Values.mtls.enabled }}
        - {name: tls, secret: {secretName: {{ .Values.mtls.secretName }}}}
        {{- end }}
        {{- if and .Values.privateFederation.enabled .Values.privateFederation.peerCaSecretName }}
        - {name: peer-ca, secret: {secretName: {{ .Values.privateFederation.peerCaSecretName }}}}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-gateway
spec:
  type: {{ .Values.gateway.service.type }}
  selector: {app: {{ .Release.Name }}-gateway}
  ports: [{port: {{ .Values.gateway.service.port }}, targetPort: http, name: http}]
