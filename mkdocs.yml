site_name: XCP
site_description: A trust layer for agents that call tools and agents they don't own.
site_url: https://agi-gateway.github.io/XCP/
repo_url: https://github.com/AGI-Gateway/XCP
repo_name: AGI-Gateway/XCP
edit_uri: edit/main/docs/
copyright: MIT · XCP and ERC-8004x are draft proposals

# Pages are served as /page.html rather than /page/.
#
# Not cosmetic. With directory URLs, docs/diagrams.md is served at /diagrams/,
# and every relative path inside it gains a level: an image at
# docs/diagrams/fig.svg referenced as "diagrams/fig.svg" resolves to
# /diagrams/diagrams/fig.svg and 404s. The same reference is correct on GitHub,
# where the page is a file in docs/ -- so with directory URLs on, the diagrams
# render on GitHub and are broken on the site, which is the worse way round for
# a defect to be discovered.
#
# Turning this off makes relative paths mean the same thing in both places.
# Free to change now because the site has never been published; after it has,
# this would break every existing URL.
use_directory_urls: false

theme:
  name: material
  language: en
  palette:
    scheme: slate
    primary: black
    accent: teal
  font:
    text: Space Grotesk
    code: Space Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/xcp.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.emoji

nav:
  - Home: index.md
  - Start here:
      - Self-serve guide: self-serve.md
      - Trust lattice: trust-lattice.md
      - Trust Firewall: trust-firewall.md
  - Build:
      - Technical diagrams: diagrams.md
      - Configuration reference: configuration.md
      - Architecture: architecture.md
      - Protocol reference: protocol.md
      - Receipts & settlement: receipts.md
      - Discovery & publishing: discovery.md
      - Providers — extend XCP: providers.md
      - SaaS connectors: connectors.md
      - Vault & authentication: vault.md
  - Operate:
      - Security model: security.md
      - Conformance: conformance.md
      - Contract review: contract-review.md
      - Privacy & retention: privacy.md
      - Compliance mapping: compliance.md
      - Deployment: deployment.md
      - Operator runbook: runbook.md
      - Performance: performance.md
      - Run a node — the Agentic Internet: agentic-internet.md
  - Project:
      - Contributing: contributing.md
      - Governance: governance.md
      - Roadmap: roadmap.md

extra:
  social:
    - {icon: fontawesome/brands/github, link: https://github.com/AGI-Gateway/XCP}
  status:
    draft: Draft proposal
