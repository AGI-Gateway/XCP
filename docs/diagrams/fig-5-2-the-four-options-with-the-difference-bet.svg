<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="492" viewBox="0 0 1040 492" role="img" aria-label="Four deployment shapes compared: a single gateway container; a three-service compose stack adding verifier and reference server; a Helm release on Kubernetes adding digest pinning and a mounted peer certificate authority; and a private federation across two datacentres adding declared peer ranges, a signed cluster charter, site locality and residency policy.">
  <style>
    :root { --bg:#f6f8f7; --surface:#ffffff; --surface-2:#edf2f0; --fg:#141d1c; --fg-2:#3b4a47; --muted:#5f6e6b; --rule:#d5deda; --rule-2:#bdc9c6; --accent:#0a6a62; --accent-wash:#e2efec; --refuse:#9a3326; --refuse-wash:#f8e9e6; color: var(--fg); }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b1110; --surface:#121a18; --surface-2:#1a2422; --fg:#e6ecea; --fg-2:#c2cecb; --muted:#8b9a96; --rule:#233230; --rule-2:#2e403d; --accent:#49d0be; --accent-wash:#14302c; --refuse:#ef9079; --refuse-wash:#32201b; color: var(--fg); }
    }
    .t{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:12.5px; fill:currentColor}
    .tb{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:12.5px; font-weight:600; fill:currentColor}
    .tm{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:11.5px; fill:currentColor}
    .ts{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:11px; fill:currentColor; opacity:.72}
    .tl{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:10px; letter-spacing:.1em; fill:currentColor; opacity:.62}
    .big{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:19px; font-weight:500; fill:currentColor}
    .acc{fill:var(--accent)} .ref{fill:var(--refuse)}
    .bx{fill:var(--surface-2); stroke:var(--rule-2); stroke-width:1}
    .bx-a{fill:var(--accent-wash); stroke:var(--accent); stroke-width:1.4}
    .bx-r{fill:var(--refuse-wash); stroke:var(--refuse); stroke-width:1.2}
    .env{fill:none; stroke:var(--rule-2); stroke-width:1; stroke-dasharray:5 4}
    .ln{stroke:currentColor; stroke-width:1.3; fill:none}
    .ln-a{stroke:var(--accent); stroke-width:1.8; fill:none}
    .ln-r{stroke:var(--refuse); stroke-width:1.3; fill:none; stroke-dasharray:5 3}
  </style>
  <rect width="100%" height="100%" fill="var(--bg)"/>
          <defs><marker id="faa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker>
          <marker id="fab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--accent)"/></marker></defs>

          <!-- A -->
          <text x="16" y="28" class="tl">A · SINGLE CONTAINER</text>
          <rect x="16" y="40" width="222" height="180" rx="5" class="bx"/>
          <rect x="32" y="56" width="190" height="42" rx="4" class="bx-a"/>
          <text x="44" y="82" class="tb acc">gateway :8080</text>
          <text x="32" y="124" class="ts">XCP_POSTURE=observe</text>
          <text x="32" y="142" class="ts">no verifier, no peers</text>
          <text x="32" y="160" class="ts">public trust store</text>
          <text x="32" y="188" class="tm">docker run -e ROLE=gateway</text>
          <text x="32" y="208" class="ts">Evaluation. Audits, refuses nothing.</text>

          <!-- B -->
          <text x="274" y="28" class="tl">B · COMPOSE STACK</text>
          <rect x="274" y="40" width="222" height="180" rx="5" class="bx"/>
          <rect x="290" y="56" width="190" height="34" rx="4" class="bx-a"/>
          <text x="302" y="78" class="tb acc">gateway :8080</text>
          <rect x="290" y="98" width="190" height="30" rx="4" class="bx"/>
          <text x="302" y="118" class="t">server :9001</text>
          <rect x="290" y="136" width="190" height="30" rx="4" class="bx"/>
          <text x="302" y="156" class="t">verifier :8500</text>
          <text x="290" y="186" class="tm acc">+ enforce + XCP_SECURITY=1</text>
          <text x="290" y="204" class="ts">The full decision path, on one host.</text>

          <!-- C -->
          <text x="532" y="28" class="tl">C · HELM ON KUBERNETES</text>
          <rect x="532" y="40" width="222" height="180" rx="5" class="bx"/>
          <rect x="548" y="56" width="190" height="34" rx="4" class="bx-a"/>
          <text x="560" y="78" class="tb acc">gateway Deployment</text>
          <rect x="548" y="98" width="190" height="30" rx="4" class="bx"/>
          <text x="560" y="118" class="t">verifier Deployment</text>
          <rect x="548" y="136" width="190" height="30" rx="4" class="bx"/>
          <text x="560" y="156" class="tm">Secret: peer-ca (ro)</text>
          <text x="548" y="186" class="tm acc">+ image digest pin</text>
          <text x="548" y="204" class="ts">A tag is mutable. This chart is pinnable.</text>

          <!-- D -->
          <text x="790" y="28" class="tl">D · PRIVATE FEDERATION</text>
          <rect x="790" y="40" width="234" height="180" rx="5" class="bx-a"/>
          <rect x="806" y="56" width="202" height="34" rx="4" class="bx"/>
          <text x="818" y="78" class="tb">site eu-west</text>
          <rect x="806" y="124" width="202" height="34" rx="4" class="bx"/>
          <text x="818" y="146" class="tb">site us-east</text>
          <line x1="907" y1="90" x2="907" y2="120" class="ln-a" marker-end="url(#fab)"/>
          <line x1="907" y1="124" x2="907" y2="94" class="ln-a" marker-end="url(#fab)"/>
          <text x="914" y="112" class="tm acc">mTLS</text>
          <text x="806" y="186" class="tm acc">+ charter + CIDRs + sites</text>
          <text x="806" y="204" class="ts">Independent agents, one trust domain.</text>

          <!-- what D adds, in detail -->
          <rect x="16" y="248" width="1008" height="228" rx="5" class="bx"/>
          <text x="32" y="272" class="tb">What option D turns on, and why each piece is separate</text>

          <text x="32" y="302" class="tm acc">XCP_PRIVATE_PEER_CIDRS</text>
          <text x="32" y="320" class="ts">Declares where peers live. Narrower</text>
          <text x="32" y="336" class="ts">than “allow private”, and an undeclared</text>
          <text x="32" y="352" class="ts">range is still refused. Min prefix /8.</text>

          <text x="286" y="302" class="tm acc">XCP_PEER_CA_BUNDLE</text>
          <text x="286" y="320" class="ts">REPLACES the public trust store for peer</text>
          <text x="286" y="336" class="ts">connections. An internal CA is the point;</text>
          <text x="286" y="352" class="ts">adding to the public set would defeat it.</text>

          <text x="540" y="302" class="tm acc">Signed cluster charter</text>
          <text x="540" y="320" class="ts">A Merkle commitment to the member set —</text>
          <text x="540" y="336" class="ts">root, not roster. Removal is an epoch bump,</text>
          <text x="540" y="352" class="ts">so there is no revocation list to distribute.</text>

          <text x="794" y="302" class="tm acc">NODE_SITE + residency</text>
          <text x="794" y="320" class="ts">Locality prices a cross-site hop at 25;</text>
          <text x="794" y="336" class="ts">residency removes a site from the candidate</text>
          <text x="794" y="352" class="ts">set entirely. Fig 4.2.</text>

          <line x1="32" y1="376" x2="1008" y2="376" class="ln" stroke-dasharray="3 3" opacity=".5"/>
          <text x="32" y="400" class="tb">Membership is proof of possession, not a bearer credential</text>
          <text x="32" y="420" class="ts">A member presents a static membership claim plus an EIP-712 signature over an access request naming the audience, with a 60-second TTL. A captured claim alone</text>
          <text x="32" y="438" class="ts">buys nothing — it carries no signature — and a captured request expires before it can be replayed elsewhere. <tspan class="tm">membership_root</tspan> is byte-compatible with the on-chain</text>
          <text x="32" y="456" class="ts"><tspan class="tm">NodeRegistry.verifyMembership</tspan>, so a cluster can run with no chain at all and still be checked against one later.</text>
        </svg>
