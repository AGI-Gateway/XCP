<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="596" viewBox="0 0 1040 596" role="img" aria-label="A gateway node showing four internal planes — admission, authority, policy, egress — crossed in order by requests arriving from agents, peer nodes and tools, with upstream MCP servers, verified peers, the verifier and the credential vault on the far side, and a hash-chained decision record beneath.">
  <style>
    :root { --bg:#f6f8f7; --surface:#ffffff; --surface-2:#edf2f0; --fg:#141d1c; --fg-2:#3b4a47; --muted:#5f6e6b; --rule:#d5deda; --rule-2:#bdc9c6; --accent:#0a6a62; --accent-wash:#e2efec; --refuse:#9a3326; --refuse-wash:#f8e9e6; color: var(--fg); }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b1110; --surface:#121a18; --surface-2:#1a2422; --fg:#e6ecea; --fg-2:#c2cecb; --muted:#8b9a96; --rule:#233230; --rule-2:#2e403d; --accent:#49d0be; --accent-wash:#14302c; --refuse:#ef9079; --refuse-wash:#32201b; color: var(--fg); }
    }
    .t{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:12.5px; fill:currentColor}
    .tb{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:12.5px; font-weight:600; fill:currentColor}
    .tm{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:11.5px; fill:currentColor}
    .ts{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:11px; fill:currentColor; opacity:.72}
    .tl{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:10px; letter-spacing:.1em; fill:currentColor; opacity:.62}
    .big{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:19px; font-weight:500; fill:currentColor}
    .acc{fill:var(--accent)} .ref{fill:var(--refuse)}
    .bx{fill:var(--surface-2); stroke:var(--rule-2); stroke-width:1}
    .bx-a{fill:var(--accent-wash); stroke:var(--accent); stroke-width:1.4}
    .bx-r{fill:var(--refuse-wash); stroke:var(--refuse); stroke-width:1.2}
    .env{fill:none; stroke:var(--rule-2); stroke-width:1; stroke-dasharray:5 4}
    .ln{stroke:currentColor; stroke-width:1.3; fill:none}
    .ln-a{stroke:var(--accent); stroke-width:1.8; fill:none}
    .ln-r{stroke:var(--refuse); stroke-width:1.3; fill:none; stroke-dasharray:5 3}
  </style>
  <rect width="100%" height="100%" fill="var(--bg)"/>
          <defs>
            <marker id="f1a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker>
            <marker id="f1b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--accent)"/></marker>
          </defs>

          <!-- callers -->
          <text x="16" y="34" class="tl">CALLERS</text>
          <rect x="16" y="52" width="150" height="54" rx="4" class="bx"/>
          <text x="30" y="74" class="tb">Agent</text><text x="30" y="92" class="ts">holds a session binding</text>
          <rect x="16" y="130" width="150" height="54" rx="4" class="bx"/>
          <text x="30" y="152" class="tb">Peer gateway</text><text x="30" y="170" class="ts">another datacentre</text>
          <rect x="16" y="208" width="150" height="54" rx="4" class="bx"/>
          <text x="30" y="230" class="tb">Tool</text><text x="30" y="248" class="ts">chaining to a second tool</text>

          <line x1="166" y1="79"  x2="214" y2="112" class="ln" marker-end="url(#f1a)"/>
          <line x1="166" y1="157" x2="214" y2="124" class="ln" marker-end="url(#f1a)"/>
          <line x1="166" y1="235" x2="214" y2="136" class="ln" marker-end="url(#f1a)"/>

          <!-- gateway envelope -->
          <rect x="222" y="30" width="520" height="538" rx="6" class="env"/>
          <text x="238" y="52" class="tl">XCP GATEWAY · ROLE=gateway · :8080</text>

          <!-- plane 1 -->
          <rect x="238" y="66" width="488" height="104" rx="4" class="bx"/>
          <text x="252" y="88" class="tb acc">1 · Admission</text>
          <text x="252" y="108" class="tm">_negotiate</text><text x="252" y="124" class="ts">protocol version</text>
          <text x="400" y="108" class="tm">trustfirewall.limits</text><text x="400" y="124" class="ts">token bucket, pre-auth</text>
          <text x="590" y="108" class="tm">parse_ctx</text><text x="590" y="124" class="ts">XCP-Context → binding</text>
          <text x="252" y="152" class="ts">Refuses before any signature is verified, so a flood costs the node a bucket decrement.</text>

          <line x1="482" y1="170" x2="482" y2="194" class="ln-a" marker-end="url(#f1b)"/>

          <!-- plane 2 -->
          <rect x="238" y="196" width="488" height="104" rx="4" class="bx"/>
          <text x="252" y="218" class="tb acc">2 · Authority</text>
          <text x="252" y="238" class="tm">trust.tiers.resolve</text><text x="252" y="254" class="ts">lattice → mandate envelope</text>
          <text x="440" y="238" class="tm">check_mandate</text><text x="440" y="254" class="ts">scope ⊆ envelope</text>
          <text x="590" y="238" class="tm">vault.sealed</text><text x="590" y="254" class="ts">upstream credential</text>
          <text x="252" y="282" class="ts">Scope is derived from the Mcp-Method / Mcp-Name headers, so it is known only after the body is read.</text>

          <line x1="482" y1="300" x2="482" y2="324" class="ln-a" marker-end="url(#f1b)"/>

          <!-- plane 3 -->
          <rect x="238" y="326" width="488" height="104" rx="4" class="bx"/>
          <text x="252" y="348" class="tb acc">3 · Policy</text>
          <text x="252" y="368" class="tm">trustfirewall.firewall</text><text x="252" y="384" class="ts">operator rules</text>
          <text x="440" y="368" class="tm">delegation.admit</text><text x="440" y="384" class="ts">cross-boundary ticket</text>
          <text x="590" y="368" class="tm">routing.admissible</text><text x="590" y="384" class="ts">residency, locality</text>
          <text x="252" y="412" class="ts">The operator's narrowing. It may only restrict what plane 2 resolved.</text>

          <line x1="482" y1="430" x2="482" y2="454" class="ln-a" marker-end="url(#f1b)"/>

          <!-- plane 4 -->
          <rect x="238" y="456" width="488" height="100" rx="4" class="bx-a"/>
          <text x="252" y="478" class="tb acc">4 · Egress</text>
          <text x="252" y="498" class="tm">xcpsec.argfirewall</text><text x="252" y="514" class="ts">injection, SSRF in args</text>
          <text x="430" y="498" class="tm">xcpsec.egress</text><text x="430" y="514" class="ts">check_url, every address</text>
          <text x="582" y="498" class="tm">mtls · peerfetch</text><text x="582" y="514" class="ts">pinned peer trust store</text>
          <text x="252" y="542" class="ts">The last boundary before bytes leave the process.</text>

          <!-- right side -->
          <text x="786" y="34" class="tl">DESTINATIONS &amp; SERVICES</text>
          <rect x="786" y="52" width="238" height="54" rx="4" class="bx"/>
          <text x="800" y="74" class="tb">Upstream MCP servers</text><text x="800" y="92" class="tm">XCP_UPSTREAMS</text>
          <rect x="786" y="130" width="238" height="54" rx="4" class="bx"/>
          <text x="800" y="152" class="tb">Verified peers</text><text x="800" y="170" class="tm">federation.node</text>
          <rect x="786" y="300" width="238" height="54" rx="4" class="bx"/>
          <text x="800" y="322" class="tb">Verifier · :8500</text><text x="800" y="340" class="tm">ERC-8004 · NodeRegistry</text>
          <rect x="786" y="378" width="238" height="54" rx="4" class="bx"/>
          <text x="800" y="400" class="tb">Credential vault</text><text x="800" y="418" class="tm">vault.sealed · vault.idp</text>

          <line x1="726" y1="490" x2="770" y2="420" class="ln"/>
          <line x1="726" y1="490" x2="790" y2="106" class="ln" marker-end="url(#f1a)"/>
          <line x1="726" y1="500" x2="790" y2="166" class="ln" marker-end="url(#f1a)"/>
          <text x="742" y="258" class="ts" transform="rotate(-76 742 258)">allowed call</text>
          <line x1="726" y1="248" x2="782" y2="320" class="ln" stroke-dasharray="4 3" marker-end="url(#f1a)"/>
          <text x="738" y="300" class="ts">verify</text>
          <line x1="726" y1="240" x2="782" y2="398" class="ln" stroke-dasharray="4 3" marker-end="url(#f1a)"/>

          <!-- record rail -->
          <rect x="16" y="300" width="150" height="256" rx="4" class="bx"/>
          <text x="30" y="322" class="tb">Decision record</text>
          <text x="30" y="342" class="tm">receipts</text>
          <text x="30" y="358" class="tm">.CallChain</text>
          <text x="30" y="382" class="ts">Every outcome —</text>
          <text x="30" y="398" class="ts">allow, reject, block,</text>
          <text x="30" y="414" class="ts">deny — is recorded</text>
          <text x="30" y="430" class="ts">with its reason.</text>
          <text x="30" y="456" class="ts">Hash-chained, so</text>
          <text x="30" y="472" class="ts">tampering changes</text>
          <text x="30" y="488" class="ts">the root.</text>
          <text x="30" y="528" class="tl">EU AI ACT ART. 12</text>
          <text x="30" y="546" class="tl">SOC 2 · DORA</text>
          <line x1="222" y1="118" x2="170" y2="330" class="ln" stroke-dasharray="3 3" marker-end="url(#f1a)"/>
          <line x1="222" y1="248" x2="170" y2="360" class="ln" stroke-dasharray="3 3" marker-end="url(#f1a)"/>
          <line x1="222" y1="378" x2="170" y2="400" class="ln" stroke-dasharray="3 3" marker-end="url(#f1a)"/>
          <line x1="222" y1="506" x2="170" y2="440" class="ln" stroke-dasharray="3 3" marker-end="url(#f1a)"/>
        </svg>
