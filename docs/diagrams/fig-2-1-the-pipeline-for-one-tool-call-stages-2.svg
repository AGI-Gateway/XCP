<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="744" viewBox="0 0 1040 744" role="img" aria-label="The guardrail pipeline for a tool call, ten stages in order from protocol negotiation to egress, each with its refusal branching to the right, and every outcome recorded to the hash-chained decision log.">
  <style>
    :root { --bg:#f6f8f7; --surface:#ffffff; --surface-2:#edf2f0; --fg:#141d1c; --fg-2:#3b4a47; --muted:#5f6e6b; --rule:#d5deda; --rule-2:#bdc9c6; --accent:#0a6a62; --accent-wash:#e2efec; --refuse:#9a3326; --refuse-wash:#f8e9e6; color: var(--fg); }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b1110; --surface:#121a18; --surface-2:#1a2422; --fg:#e6ecea; --fg-2:#c2cecb; --muted:#8b9a96; --rule:#233230; --rule-2:#2e403d; --accent:#49d0be; --accent-wash:#14302c; --refuse:#ef9079; --refuse-wash:#32201b; color: var(--fg); }
    }
    .t{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:12.5px; fill:currentColor}
    .tb{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:12.5px; font-weight:600; fill:currentColor}
    .tm{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:11.5px; fill:currentColor}
    .ts{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:11px; fill:currentColor; opacity:.72}
    .tl{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:10px; letter-spacing:.1em; fill:currentColor; opacity:.62}
    .big{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:19px; font-weight:500; fill:currentColor}
    .acc{fill:var(--accent)} .ref{fill:var(--refuse)}
    .bx{fill:var(--surface-2); stroke:var(--rule-2); stroke-width:1}
    .bx-a{fill:var(--accent-wash); stroke:var(--accent); stroke-width:1.4}
    .bx-r{fill:var(--refuse-wash); stroke:var(--refuse); stroke-width:1.2}
    .env{fill:none; stroke:var(--rule-2); stroke-width:1; stroke-dasharray:5 4}
    .ln{stroke:currentColor; stroke-width:1.3; fill:none}
    .ln-a{stroke:var(--accent); stroke-width:1.8; fill:none}
    .ln-r{stroke:var(--refuse); stroke-width:1.3; fill:none; stroke-dasharray:5 3}
  </style>
  <rect width="100%" height="100%" fill="var(--bg)"/>
          <defs>
            <marker id="f3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker>
            <marker id="f3r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--refuse)"/></marker>
            <marker id="f3b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--accent)"/></marker>
          </defs>

          <text x="16" y="24" class="tl">POST /V1/A2T/CALL</text>
          <text x="560" y="24" class="tl">REFUSAL</text>
          <text x="878" y="24" class="tl">RECORDED AS</text>

          <rect x="16" y="36" width="240" height="30" rx="4" class="bx"/>
          <text x="28" y="56" class="tm">request arrives</text>
          <line x1="136" y1="66" x2="136" y2="84" class="ln-a" marker-end="url(#f3b)"/>

          <!-- 1 -->
          <rect x="16" y="86" width="430" height="46" rx="4" class="bx"/>
          <text x="28" y="105" class="tb">1 · _negotiate</text><text x="28" y="122" class="ts">supported protocol revision?</text>
          <line x1="446" y1="109" x2="548" y2="109" class="ln-r" marker-end="url(#f3r)"/>
          <text x="560" y="106" class="tm ref">400</text><text x="560" y="122" class="ts">unsupported revision</text>
          <line x1="136" y1="132" x2="136" y2="150" class="ln-a" marker-end="url(#f3b)"/>

          <!-- 2 -->
          <rect x="16" y="152" width="430" height="46" rx="4" class="bx-a"/>
          <text x="28" y="171" class="tb acc">2 · _limit(preauth=True)</text><text x="28" y="188" class="ts">token bucket — runs before any signature work</text>
          <line x1="446" y1="175" x2="548" y2="175" class="ln-r" marker-end="url(#f3r)"/>
          <text x="560" y="172" class="tm ref">429 + Retry-After</text><text x="560" y="188" class="ts">bucket empty</text>
          <line x1="136" y1="198" x2="136" y2="216" class="ln-a" marker-end="url(#f3b)"/>

          <!-- 3 -->
          <rect x="16" y="218" width="430" height="46" rx="4" class="bx"/>
          <text x="28" y="237" class="tb">3 · parse_ctx</text><text x="28" y="254" class="ts">XCP-Context header → session binding</text>
          <line x1="136" y1="264" x2="136" y2="282" class="ln-a" marker-end="url(#f3b)"/>

          <!-- 4 -->
          <rect x="16" y="284" width="430" height="46" rx="4" class="bx"/>
          <text x="28" y="303" class="tb">4 · binding verified?</text><text x="28" y="320" class="ts">only decisive when XCP_POSTURE=enforce</text>
          <line x1="446" y1="307" x2="548" y2="307" class="ln-r" marker-end="url(#f3r)"/>
          <text x="560" y="304" class="tm ref">reject</text><text x="560" y="320" class="ts">observe mode audits and continues</text>
          <line x1="136" y1="330" x2="136" y2="348" class="ln-a" marker-end="url(#f3b)"/>

          <!-- 5 -->
          <rect x="16" y="350" width="430" height="46" rx="4" class="bx"/>
          <text x="28" y="369" class="tb">5 · read body · _limit(scope, bytes)</text><text x="28" y="386" class="ts">second decrement, now priced by scope and size</text>
          <line x1="446" y1="373" x2="548" y2="373" class="ln-r" marker-end="url(#f3r)"/>
          <text x="560" y="370" class="tm ref">413 / 429</text><text x="560" y="386" class="ts">oversized body</text>
          <line x1="136" y1="396" x2="136" y2="414" class="ln-a" marker-end="url(#f3b)"/>

          <!-- 6 -->
          <rect x="16" y="416" width="430" height="46" rx="4" class="bx-a"/>
          <text x="28" y="435" class="tb acc">6 · check_mandate(mandate, binding, scope)</text><text x="28" y="452" class="ts">scope now known — derived from Mcp-Method / Mcp-Name</text>
          <line x1="446" y1="439" x2="548" y2="439" class="ln-r" marker-end="url(#f3r)"/>
          <text x="560" y="436" class="tm ref">deny</text><text x="560" y="452" class="ts">scope outside the mandate</text>
          <line x1="136" y1="462" x2="136" y2="480" class="ln-a" marker-end="url(#f3b)"/>

          <!-- 7 -->
          <rect x="16" y="482" width="430" height="46" rx="4" class="bx"/>
          <text x="28" y="501" class="tb">7 · _check_upstream_credential</text><text x="28" y="518" class="ts">a sealed reference, never a bearer token in transit</text>
          <line x1="446" y1="505" x2="548" y2="505" class="ln-r" marker-end="url(#f3r)"/>
          <text x="560" y="502" class="tm ref">refuse</text><text x="560" y="518" class="ts">credential not sealed for this upstream</text>
          <line x1="136" y1="528" x2="136" y2="546" class="ln-a" marker-end="url(#f3b)"/>

          <!-- 8 -->
          <rect x="16" y="548" width="430" height="46" rx="4" class="bx"/>
          <text x="28" y="567" class="tb">8 · _policy_check(ctx, scope, arguments)</text><text x="28" y="584" class="ts">operator rules and entitlement narrowing</text>
          <line x1="446" y1="571" x2="548" y2="571" class="ln-r" marker-end="url(#f3r)"/>
          <text x="560" y="568" class="tm ref">block</text><text x="560" y="584" class="ts">denied scope, budget, counterparty</text>
          <line x1="136" y1="594" x2="136" y2="612" class="ln-a" marker-end="url(#f3b)"/>

          <!-- 9 -->
          <rect x="16" y="614" width="430" height="46" rx="4" class="bx"/>
          <text x="28" y="633" class="tb">9 · xcpsec.argfirewall</text><text x="28" y="650" class="ts">command injection and SSRF in tool arguments</text>
          <line x1="446" y1="637" x2="548" y2="637" class="ln-r" marker-end="url(#f3r)"/>
          <text x="560" y="634" class="tm ref">400</text><text x="560" y="650" class="ts">argument firewall violation</text>
          <line x1="136" y1="660" x2="136" y2="678" class="ln-a" marker-end="url(#f3b)"/>

          <!-- 10 -->
          <rect x="16" y="680" width="430" height="46" rx="4" class="bx-a"/>
          <text x="28" y="699" class="tb acc">10 · _route_mcp → xcpsec.egress.check_url</text><text x="28" y="716" class="ts">scheme, credentials, and every resolved address</text>
          <line x1="446" y1="703" x2="548" y2="703" class="ln-r" marker-end="url(#f3r)"/>
          <text x="560" y="700" class="tm ref">EgressDenied</text><text x="560" y="716" class="ts">host does not resolve to a permitted address</text>

          <!-- record rail -->
          <rect x="860" y="36" width="164" height="690" rx="4" class="bx"/>
          <text x="874" y="60" class="tb">record_decision</text>
          <text x="874" y="78" class="tm">+ audit()</text>
          <text x="874" y="110" class="ts">Called on every</text>
          <text x="874" y="126" class="ts">branch above —</text>
          <text x="874" y="142" class="ts">including allow —</text>
          <text x="874" y="158" class="ts">with the decision,</text>
          <text x="874" y="174" class="ts">the reason, the</text>
          <text x="874" y="190" class="ts">scope and the tier.</text>
          <text x="874" y="222" class="ts">A refusal with no</text>
          <text x="874" y="238" class="ts">record is a refusal</text>
          <text x="874" y="254" class="ts">nobody can audit,</text>
          <text x="874" y="270" class="ts">so the record is</text>
          <text x="874" y="286" class="ts">not optional.</text>
          <text x="874" y="326" class="tl">PROMETHEUS</text>
          <text x="874" y="346" class="ts">requests{stream,</text>
          <text x="874" y="362" class="ts">decision}</text>
          <text x="874" y="382" class="ts">denials{scope}</text>
          <line x1="840" y1="109" x2="854" y2="109" class="ln" stroke-dasharray="3 3" marker-end="url(#f3a)"/>
          <line x1="840" y1="307" x2="854" y2="307" class="ln" stroke-dasharray="3 3" marker-end="url(#f3a)"/>
          <line x1="840" y1="439" x2="854" y2="439" class="ln" stroke-dasharray="3 3" marker-end="url(#f3a)"/>
          <line x1="840" y1="571" x2="854" y2="571" class="ln" stroke-dasharray="3 3" marker-end="url(#f3a)"/>
          <line x1="840" y1="703" x2="854" y2="703" class="ln" stroke-dasharray="3 3" marker-end="url(#f3a)"/>
        </svg>
