<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="556" viewBox="0 0 1040 556" role="img" aria-label="The separation boundary. On the left, XCP's authorization pipeline reaches a permit decision and records it. On the right, the classifier produces a verdict which becomes advice. One arrow crosses the boundary, carrying a route preference and audit detail into route selection, which happens after the decision. Four arrows are blocked: advice cannot grant a scope, raise or lower a tier ceiling, skip a check, or widen a budget.">
  <style>
    :root { --bg:#f6f8f7; --surface:#ffffff; --surface-2:#edf2f0; --fg:#141d1c; --fg-2:#3b4a47; --muted:#5f6e6b; --rule:#d5deda; --rule-2:#bdc9c6; --accent:#0a6a62; --accent-wash:#e2efec; --refuse:#9a3326; --refuse-wash:#f8e9e6; color: var(--fg); }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#0b1110; --surface:#121a18; --surface-2:#1a2422; --fg:#e6ecea; --fg-2:#c2cecb; --muted:#8b9a96; --rule:#233230; --rule-2:#2e403d; --accent:#49d0be; --accent-wash:#14302c; --refuse:#ef9079; --refuse-wash:#32201b; color: var(--fg); }
    }
    .t{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:12.5px; fill:currentColor}
    .tb{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:12.5px; font-weight:600; fill:currentColor}
    .tm{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:11.5px; fill:currentColor}
    .ts{font-family:ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:11px; fill:currentColor; opacity:.72}
    .tl{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:10px; letter-spacing:.1em; fill:currentColor; opacity:.62}
    .big{font-family:ui-monospace,'SF Mono',SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace; font-size:19px; font-weight:500; fill:currentColor}
    .acc{fill:var(--accent)} .ref{fill:var(--refuse)}
    .bx{fill:var(--surface-2); stroke:var(--rule-2); stroke-width:1}
    .bx-a{fill:var(--accent-wash); stroke:var(--accent); stroke-width:1.4}
    .bx-r{fill:var(--refuse-wash); stroke:var(--refuse); stroke-width:1.2}
    .env{fill:none; stroke:var(--rule-2); stroke-width:1; stroke-dasharray:5 4}
    .ln{stroke:currentColor; stroke-width:1.3; fill:none}
    .ln-a{stroke:var(--accent); stroke-width:1.8; fill:none}
    .ln-r{stroke:var(--refuse); stroke-width:1.3; fill:none; stroke-dasharray:5 3}
  </style>
  <rect width="100%" height="100%" fill="var(--bg)"/>
          <defs>
            <marker id="g2a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="currentColor"/></marker>
            <marker id="g2b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" fill="var(--accent)"/></marker>
          </defs>

          <!-- authorization column -->
          <rect x="16" y="40" width="380" height="300" rx="6" class="env"/>
          <text x="30" y="62" class="tl">AUTHORIZATION — XCP DECIDES, ALONE</text>

          <rect x="32" y="76" width="348" height="40" rx="4" class="bx"/>
          <text x="44" y="101" class="tm">identity · mandate · scope</text>
          <line x1="206" y1="116" x2="206" y2="136" class="ln" marker-end="url(#g2a)"/>
          <rect x="32" y="138" width="348" height="40" rx="4" class="bx"/>
          <text x="44" y="163" class="tm">budget · entitlements · policy</text>
          <line x1="206" y1="178" x2="206" y2="198" class="ln" marker-end="url(#g2a)"/>
          <rect x="32" y="200" width="348" height="40" rx="4" class="bx"/>
          <text x="44" y="225" class="tm">argument firewall · egress</text>
          <line x1="206" y1="240" x2="206" y2="260" class="ln" marker-end="url(#g2a)"/>
          <rect x="32" y="262" width="348" height="62" rx="4" class="bx-a"/>
          <text x="44" y="284" class="tb acc">ALLOW or DENY — recorded, with a reason</text>
          <text x="44" y="302" class="ts">Every refusal traces to a rule a human wrote</text>
          <text x="44" y="316" class="ts">and can read. That is the property being protected.</text>

          <!-- the boundary -->
          <line x1="430" y1="30" x2="430" y2="430" class="ln-a" stroke-width="2.5"/>
          <text x="438" y="46" class="tl acc">THE BOUNDARY</text>

          <!-- classifier column -->
          <rect x="470" y="40" width="372" height="300" rx="6" class="env"/>
          <text x="484" y="62" class="tl">CLASSIFICATION — ESTIMATES ONLY</text>

          <rect x="486" y="76" width="340" height="40" rx="4" class="bx"/>
          <text x="498" y="101" class="tm">features (keys and shapes)</text>
          <line x1="656" y1="116" x2="656" y2="136" class="ln" marker-end="url(#g2a)"/>
          <rect x="486" y="138" width="340" height="40" rx="4" class="bx"/>
          <text x="498" y="163" class="tm">cascade → Verdict</text>
          <text x="700" y="163" class="ts">inert; nothing accepts one</text>
          <line x1="656" y1="178" x2="656" y2="198" class="ln" marker-end="url(#g2a)"/>
          <rect x="486" y="200" width="340" height="40" rx="4" class="bx-a"/>
          <text x="498" y="225" class="tb acc">Advice — route · scrutiny</text>
          <text x="486" y="262" class="ts">Two fields. There is no third that could carry a scope,</text>
          <text x="486" y="278" class="ts">a tier, a budget or a skipped check — so there is no</text>
          <text x="486" y="294" class="ts">path from a verdict to a wider authority to audit for.</text>
          <text x="486" y="318" class="tm">Scrutiny = { normal, elevated }</text>

          <!-- the one permitted crossing -->
          <path d="M486,220 L430,220" class="ln-a" stroke-width="2"/>
          <path d="M430,220 L430,370 L206,370 L206,392" class="ln-a" stroke-width="2" marker-end="url(#g2b)"/>
          <text x="208" y="356" class="tm acc">route preference + audit detail</text>

          <rect x="32" y="394" width="348" height="54" rx="4" class="bx-a"/>
          <text x="44" y="416" class="tb acc">Route selection — AFTER the decision</text>
          <text x="44" y="436" class="ts">Routes differ in cost and latency only</text>

          <!-- blocked crossings -->
          <text x="470" y="366" class="tl ref">BLOCKED BY CONSTRUCTION</text>
          <rect x="470" y="378" width="520" height="160" rx="4" class="bx-r"/>
          <text x="484" y="400" class="tm ref">grant a scope</text>
          <text x="700" y="400" class="ts">Advice has no field for one</text>
          <text x="484" y="420" class="tm ref">raise a tier ceiling</text>
          <text x="700" y="420" class="ts">narrowing is one-way and this is not it</text>
          <text x="484" y="440" class="tm ref">LOWER a tier ceiling</text>
          <text x="700" y="440" class="ts">deliberately absent — see below</text>
          <text x="484" y="460" class="tm ref">skip a check</text>
          <text x="700" y="460" class="ts">Route fields are allowlisted</text>
          <text x="484" y="480" class="tm ref">deny a request</text>
          <text x="700" y="480" class="ts">Scrutiny has no DENY member</text>
          <text x="484" y="508" class="ts">Tested by differential execution, not inspection: a decision function runs across</text>
          <text x="484" y="524" class="ts">EVERY advice value and the permit outcome must be identical.</text>

          <!-- the one that matters -->
          <text x="16" y="476" class="tl">THE CONVERSE, ALSO TESTED</text>
          <rect x="16" y="488" width="430" height="52" rx="4" class="bx"/>
          <text x="30" y="510" class="ts">Advice must CHANGE the route, or the test above passes</text>
          <text x="30" y="526" class="ts">vacuously and the engine is inert rather than safe.</text>
        </svg>
